<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Expired — Attendance System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeInUp 0.5s ease-out forwards; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    .float { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-32 -right-32 w-72 h-72 bg-white opacity-5 rounded-full"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-white opacity-5 rounded-full"></div>
  </div>

  <div class="w-full max-w-md fade-in">
    <div class="bg-white rounded-3xl shadow-2xl p-10 text-center">

      <!-- Animated icon -->
      <div class="float mb-8">
        <div class="w-24 h-24 bg-red-50 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-12 h-12 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
      </div>

      <h1 class="text-3xl font-bold text-gray-800 mb-3">Link Expired</h1>
      <p class="text-gray-500 text-base mb-2">
        This attendance link is <strong>no longer active</strong> or does not exist.
      </p>
      <p class="text-gray-400 text-sm mb-8">
        Attendance links are valid for the current day only.<br />
        Please contact your administrator for a new link.
      </p>

      <!-- Divider -->
      <div class="border-t border-gray-100 pt-6">
        <p class="text-sm text-gray-400 mb-4">Are you an administrator?</p>
        <a href="/admin/login" class="inline-flex items-center gap-2 bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-indigo-700 active:scale-95 transition-all duration-200 shadow-md shadow-indigo-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          Go to Admin Panel
        </a>
      </div>

    </div>

    <p class="text-center text-white text-opacity-50 text-xs mt-6">
      Attendance System &copy; 2024
    </p>
  </div>
</body>
</html>
